name: Fetch today's puzzle
on:
  schedule:
    # Scheduled events are best-effort and may be delayed or dropped. Retry
    # densely around rollover so one missed event cannot make the archive late.
    - cron: '4/5 0-1 * * *'
      timezone: America/New_York
    - cron: '23 2-23 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      from: { description: 'start date YYYY-MM-DD (optional)', required: false }
      to: { description: 'end date YYYY-MM-DD (optional)', required: false }
permissions:
  contents: read
concurrency:
  group: puzzle-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      ingest_failed: ${{ steps.ingest.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Fetch missing puzzles
        id: ingest
        continue-on-error: true
        env:
          FROM_DATE: ${{ inputs.from }}
          TO_DATE: ${{ inputs.to }}
        run: |
          for value in "$FROM_DATE" "$TO_DATE"; do
            if [[ -n "$value" && ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo 'Dates must use YYYY-MM-DD.' >&2
              exit 1
            fi
          done
          args=()
          if [ -n "$FROM_DATE" ]; then args+=("$FROM_DATE"); fi
          if [ -n "$TO_DATE" ]; then
            if [ -z "$FROM_DATE" ]; then echo 'A start date is required with an end date.' >&2; exit 1; fi
            args+=("$TO_DATE")
          fi
          node scripts/fetch.mjs "${args[@]}"
      - run: node --test 'test/*.test.mjs'
      - name: Commit changed data
        id: commit
        run: |
          git config user.name 'pipsarchive-bot'
          git config user.email 'bot@pipsarchive.com'
          git add data src/data/archive.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "puzzle data $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
  report:
    needs: [fetch, deploy]
    if: always() && needs.fetch.outputs.ingest_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report incomplete ingestion
        run: |
          echo 'Some requested puzzles could not be fetched. Valid new puzzles were retained; inspect the fetch log and retry.' >&2
          exit 1
