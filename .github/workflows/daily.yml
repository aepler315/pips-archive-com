name: Fetch today's puzzle
on:
  schedule:
    # GitHub Actions cron is UTC-only, so midnight America/New_York (the NYT's
    # own rollover) needs two fixed triggers, one per DST regime. Both always
    # run fetch.mjs; it's idempotent (skips dates it already has), so whichever
    # trigger fires - even if GitHub delays it past its "own" hour - fetches
    # today's puzzle, and the other is just a harmless no-op.
    - cron: '5 4 * * *'   # 00:05 ET during EDT (UTC-4)
    - cron: '5 5 * * *'   # 00:05 ET during EST (UTC-5)
  workflow_dispatch:
    inputs:
      from: { description: 'start date YYYY-MM-DD (optional)', required: false }
      to:   { description: 'end date YYYY-MM-DD (optional)', required: false }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/fetch.mjs ${{ inputs.from }} ${{ inputs.to }}
      - run: node --test 'test/*.test.mjs'
      - name: Commit
        run: |
          git config user.name  'pipsarchive-bot'
          git config user.email 'bot@pipsarchive.com'
          git add data src/data/archive.json
          git diff --cached --quiet || git commit -m "puzzle data $(date -u +%F)"
          git push
